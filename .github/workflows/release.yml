name: Release

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version to release (without the v prefix)
        required: true
        type: string

permissions: {}

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Require an administrator running from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "Releases must run from main." >&2; exit 1; }
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)"
          test "$permission" = admin || { echo "Only repository administrators can release (permission: $permission)." >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Validate main, version, and tag
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          latest_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          checked_out_sha="$(git rev-parse HEAD)"
          test "$latest_main_sha" = "$GITHUB_SHA" && test "$checked_out_sha" = "$latest_main_sha" || { echo "Workflow is not running against the latest main commit." >&2; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Version must be stable X.Y.Z." >&2; exit 1; }
          package_version="$(node -p 'require("./package.json").version')"
          lock_version="$(node -p 'require("./package-lock.json").version')"
          test "$VERSION" = "$package_version" && test "$VERSION" = "$lock_version" || { echo "Version does not match package manifests." >&2; exit 1; }
          package_name="$(node -p 'require("./package.json").name')"
          latest_release="$(npm view "$package_name" versions --json | jq -r 'if type == "array" then .[] else . end' | sed -n 's/^\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | sort -V | tail -n 1)"
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then echo "Tag $tag already exists." >&2; exit 1; fi
          if [ -n "$latest_release" ] && [ "$VERSION" = "$latest_release" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "GitHub Release $tag already exists; refusing to recover it." >&2
              exit 1
            fi
            echo "Recovering $tag: npm already contains this version; the publish job must verify artifact integrity."
          elif [ -n "$latest_release" ] && [ "$(printf '%s\n%s\n' "$latest_release" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "Version must not be less than the latest stable npm version ($latest_release)." >&2
            exit 1
          fi
          {
            echo "release_sha=$latest_main_sha"
            echo "version=$VERSION"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pack SDK
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/npm-package" > "$RUNNER_TEMP/npm-package/pack.json"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish or verify package
        id: npm
        working-directory: package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          package_name="$(jq -r '.[0].name' pack.json)"
          package_file="$(jq -r '.[0].filename' pack.json)"
          test -f "$package_file"
          test "$(tar -xOf "$package_file" package/package.json | jq -r .version)" = "$VERSION"
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          npm_metadata="$(npm view "${package_name}@${VERSION}" --json 2>/dev/null || true)"
          if [ -n "$npm_metadata" ]; then
            published_integrity="$(jq -r '.dist.integrity // empty' <<<"$npm_metadata")"
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$package_file" | openssl base64 -A)"
            if [ -z "$published_integrity" ] || [ "$published_integrity" != "$local_integrity" ]; then
              echo "npm version ${package_name}@${VERSION} already exists but was built from different content; creating a GitHub tag/release from this commit would be unsafe." >&2
              echo "Published integrity: ${published_integrity:-missing}; local integrity: $local_integrity" >&2
              exit 1
            fi
            echo "${package_name}@${VERSION} already exists with matching integrity; not overwriting it."
          else
            npm publish "$package_file" --provenance --ignore-scripts
          fi
      - name: Verify package is available
        env:
          PACKAGE_NAME: ${{ steps.npm.outputs.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in {1..12}; do
            test "$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)" = "$VERSION" && exit 0
            [ "$attempt" -lt 12 ] && sleep 5
          done
          echo "${PACKAGE_NAME}@${VERSION} was not found in npm." >&2
          exit 1

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Revalidate main and tag before release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$RELEASE_SHA" || { echo "main changed during release." >&2; exit 1; }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then echo "Tag $TAG already exists." >&2; exit 1; fi
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "$TAG" --generate-notes

  documentation:
    needs: [github-release, validate]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch documentation for the validated release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh workflow run documentation.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag="$TAG"
